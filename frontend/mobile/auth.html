<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LawFlash AI - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#1a3b70", "accent-gold": "#c5a059" } } } }</script>
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">
<div class="flex flex-col min-h-screen max-w-sm mx-auto">

  <!-- Header -->
  <div class="flex items-center p-5">
    <a href="onboarding-3.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center shadow-sm">
      <span class="material-symbols-outlined text-slate-600 text-lg">arrow_back</span>
    </a>
  </div>

  <!-- Logo & Title -->
  <div class="px-6 pt-2 pb-6 text-center">
    <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-primary/20">
      <span class="material-symbols-outlined text-white text-3xl">balance</span>
    </div>
    <h1 class="text-slate-900 text-2xl font-extrabold">Welcome to LawFlash AI</h1>
    <p class="text-slate-500 text-sm mt-1">Sign in or create your free account</p>
  </div>

  <!-- Toggle Tabs -->
  <div class="px-6 mb-6">
    <div class="flex bg-slate-200 p-1 rounded-xl">
      <button id="signin-tab" onclick="showTab('signin')" class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-primary shadow-sm transition-all">Sign In</button>
      <button id="signup-tab" onclick="showTab('signup')" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 transition-all">Create Account</button>
    </div>
  </div>

  <!-- Sign In Form -->
  <div id="signin-form" class="px-6 flex flex-col gap-4 flex-grow">
    <div>
      <label class="text-slate-700 text-xs font-bold uppercase tracking-wider mb-1.5 block">Email Address</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-3.5 text-slate-400 text-xl">mail</span>
        <input type="email" placeholder="you@email.com" class="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:border-primary focus:outline-none transition-colors"/>
      </div>
    </div>
    <div>
      <label class="text-slate-700 text-xs font-bold uppercase tracking-wider mb-1.5 block">Password</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-3.5 text-slate-400 text-xl">lock</span>
        <input type="password" placeholder="••••••••" class="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:border-primary focus:outline-none transition-colors"/>
      </div>
      <a href="#" class="text-primary text-xs font-bold mt-2 block text-right">Forgot password?</a>
    </div>

    <a href="dashboard.html" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl text-base shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all mt-2">
      Sign In
      <span class="material-symbols-outlined">arrow_forward</span>
    </a>

    <div class="flex items-center gap-3">
      <div class="flex-grow h-px bg-slate-200"></div>
      <span class="text-slate-400 text-xs font-medium">OR</span>
      <div class="flex-grow h-px bg-slate-200"></div>
    </div>

    <button class="w-full border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-bold py-4 rounded-xl text-sm flex items-center justify-center gap-3 transition-all">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
  </div>

  <!-- Sign Up Form (hidden) -->
  <div id="signup-form" class="px-6 flex flex-col gap-4 flex-grow hidden">
    <div>
      <label class="text-slate-700 text-xs font-bold uppercase tracking-wider mb-1.5 block">Full Name</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-3.5 text-slate-400 text-xl">person</span>
        <input type="text" placeholder="Your full name" class="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:border-primary focus:outline-none transition-colors"/>
      </div>
    </div>
    <div>
      <label class="text-slate-700 text-xs font-bold uppercase tracking-wider mb-1.5 block">Email Address</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-3.5 text-slate-400 text-xl">mail</span>
        <input type="email" placeholder="you@email.com" class="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:border-primary focus:outline-none transition-colors"/>
      </div>
    </div>
    <div>
      <label class="text-slate-700 text-xs font-bold uppercase tracking-wider mb-1.5 block">Campus</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-3.5 text-slate-400 text-xl">school</span>
        <select class="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:border-primary focus:outline-none transition-colors appearance-none">
          <option>Select your campus</option>
          <option>Abuja</option>
          <option>Lagos</option>
          <option>Enugu</option>
          <option>Yola</option>
          <option>Kano</option>
          <option>Yenagoa</option>
        </select>
      </div>
    </div>
    <div>
      <label class="text-slate-700 text-xs font-bold uppercase tracking-wider mb-1.5 block">Password</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-3.5 text-slate-400 text-xl">lock</span>
        <input type="password" placeholder="Min 8 characters" class="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl text-slate-900 text-sm font-medium focus:border-primary focus:outline-none transition-colors"/>
      </div>
    </div>
    <a href="dashboard.html" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl text-base shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all">
      Create Free Account
      <span class="material-symbols-outlined">arrow_forward</span>
    </a>
    <p class="text-center text-slate-400 text-xs pb-6">By creating an account you agree to our <a href="#" class="text-primary font-bold underline">Terms of Service</a> and <a href="#" class="text-primary font-bold underline">Privacy Policy</a>.</p>
  </div>

</div>
<script>
function showTab(tab) {
  document.getElementById('signin-form').classList.toggle('hidden', tab !== 'signin');
  document.getElementById('signup-form').classList.toggle('hidden', tab !== 'signup');
  document.getElementById('signin-tab').className = tab === 'signin'
    ? 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-primary shadow-sm transition-all'
    : 'flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 transition-all';
  document.getElementById('signup-tab').className = tab === 'signup'
    ? 'flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-primary shadow-sm transition-all'
    : 'flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-500 transition-all';
}
</script>
</body>
</html>
